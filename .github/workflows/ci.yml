name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_privatelens_ci.db
      JWT_SECRET: test-secret-value-that-is-long-enough-for-production-checks
      AUTH_TOKEN_RETURN_IN_RESPONSE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-09-20
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python ../scripts/check_secrets.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: pip install pip-audit==2.10.1 bandit==1.9.4 ruff==0.16.8
      - run: pip-audit -r requirements.txt
      - run: ruff check . --select E9,F821,F822,F823
      - run: bandit -r core routers services -lll

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified 2026-09-20
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  provider-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: provider_gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-09-20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified 2026-09-20
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: provider_gateway/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
