name: Encrypted Postgres backup

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_DIR: /tmp/privatelens-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || (echo "PRODUCTION_DATABASE_URL secret is missing" >&2; exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "BACKUP_ENCRYPTION_KEY secret is missing" >&2; exit 1)
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create and encrypt backup
        run: |
          ./ops/backup_postgres.sh
          dump_file="$(find "$BACKUP_DIR" -name '*.dump' -type f -print -quit)"
          test -n "$dump_file"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$dump_file" -out "$dump_file.enc" -pass env:BACKUP_ENCRYPTION_KEY
          sha256sum "$dump_file.enc" > "$dump_file.enc.sha256"
          rm "$dump_file" "$dump_file.sha256"
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privatelens-postgres-${{ github.run_id }}
          path: /tmp/privatelens-backup/*.enc*
          if-no-files-found: error
          retention-days: 7
