services:
  - type: web
    name: privatelens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://privatelens.vercel.app
      - key: ALLOWED_HOSTS
        value: privatelens.onrender.com
