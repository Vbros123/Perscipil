services:
  - type: web
    name: privatelens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: privatelens-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://privatelens.vercel.app
      - key: ALLOWED_HOSTS
        value: privatelens.onrender.com
      - key: APP_PUBLIC_URL
        value: https://privatelens.vercel.app
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: LICENSED_DATA_GATEWAY_URL
        sync: false
      - key: LICENSED_DATA_API_KEY
        sync: false

databases:
  - name: privatelens-postgres
    databaseName: privatelens
    user: privatelens
