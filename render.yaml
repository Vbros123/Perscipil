services:
  - type: web
    name: privatelens-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://privatelens.vercel.app
      - key: ALLOWED_HOSTS
        value: privatelens.onrender.com,privatelens-api.onrender.com
      - key: APP_PUBLIC_URL
        value: https://privatelens.vercel.app
      - key: EMAIL_DELIVERY_MODE
        value: resend
      - key: DATA_MODE
        value: public
      - key: MODEL_RELEASE_STAGE
        value: shadow
      - key: FRONTEND_URL
        value: https://privatelens.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
